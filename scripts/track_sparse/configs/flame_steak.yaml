# flame_steak: 21 cameras, 2704x2028, 30 FPS, 300 frames.
#
# This file contains tracking/geometry parameters. Input/output paths, frame
# range, GPU selection, and resume/overwrite are execution controls and remain
# CLI arguments.

schema_version: "2.0.0"

data:
  image_size_tolerance_px: 1
  allow_missing_frames: true

# Six neighbours provide enough overlap around the 21-camera ring without
# paying for an all-pairs (210 pairs per spawn frame) match graph.
camera_graph:
  top_k: 6
  min_overlap: 0.10
  max_view_angle_deg: 100.0
  min_baseline_ratio: 0.01
  overlap_sample_points: 20000

# 1600 px keeps sub-pixel geometry useful while reducing the cost of the
# original 2704x2028 frames. Half precision is only used for the HDF5 cache.
features:
  extractor: superpoint
  max_keypoints: 4096
  keypoint_threshold: 0.005
  nms_radius: 4
  resize_max: 1600
  half_precision_cache: true

matching:
  matcher: superglue
  weights: outdoor
  sinkhorn_iterations: 50
  min_score: 0.20

spatial:
  epipolar_threshold_px: 1.5

# At 30 FPS, interval=10 adds new seeds every 0.33 s. Three-view birth is
# deliberately stricter than the two-view minimum used after a track exists.
spawn:
  interval: 10
  min_seed_views: 3
  duplicate_radius_px: 3.0
  min_duplicate_views: 2

# Match both t->t+1 and t->t+2 so a one-frame miss can reconnect.
temporal:
  tracker: superglue
  offsets: [1, 2]
  min_score: 0.20
  min_camera_votes: 2

association:
  offset_penalty: 0.10
  reject_cycle_inconsistent: true
  cycle_inconsistent_weight: 0.25
  cycle_consistent_bonus: 1.05
  allow_single_camera_bridge: false

triangulation:
  min_views: 2
  min_angle_deg: 1.0
  max_reprojection_error_px: 3.0
  robust_loss: huber
  max_refinement_iterations: 10

# This workstation exposes 24 logical CPUs and an RTX 5090. Leave four CPU
# threads for HDF5, the desktop and CUDA driver work.
performance:
  triangulation_backend: cuda
  cpu_workers: 20
  gpu_hypothesis_batch_size: 65536
  feature_cache_images: 96
  checkpoint_interval_frames: 10
  cache_spatial_groups: true

# Raw-video preprocessing creates one fixed reference sparse model, not a
# per-frame persparse cloud, so there is no independent cloud to verify here.
sparse_verify:
  enabled: false
  nn_scale: 3.0
  confidence_weight: 0.15

# 5/15 frames correspond to about 0.17/0.50 s at 30 FPS.
track:
  tentative_frames: 3
  max_occlusion_gap: 5
  max_lost_gap: 15
  log_interval: 10

uncertainty:
  min_pixel_sigma: 0.5
  damping: 1.0e-9
  max_condition_number: 1.0e12

identity_validation:
  enabled: true
  min_track_frames: 5
  max_checked_gap: 2
  max_step_ratio: 0.03
  max_acceleration_ratio: 0.02
  mad_multiplier: 8.0
  min_jump_sigma: 6.0
  cycle_bad_fraction: 0.50
  min_association_score: 0.25
  cycle_evidence_weight: 1.0
  weak_association_weight: 0.5
  split_score: 2.0
  min_segment_frames: 3

motion_models:
  min_valid_frames: 5
  max_static_observations: 512
  static_huber_px: 2.0
  static_refine_iterations: 6
  score_epsilon: 1.0e-6
  dynamic_dof_per_frame: 0.50
  selection_margin: 5.0
  static_max_reprojection_px: 2.5
  static_max_motion_sigma: 8.0
  dynamic_min_motion_sigma: 4.0

dynamic_optimization:
  min_position_std_ratio: 1.0e-5
  temporal_sigma_ratio: 0.005
  velocity_weight: 0.0
  acceleration_weight: 0.20
  max_smooth_gap: 2
  max_correction_sigma: 2.5

pose_refinement:
  enabled: true
  min_static_confidence: 0.70
  min_track_frames: 10
  min_points: 20
  ransac_iterations: 100
  max_reprojection_error_px: 2.5
  ransac_confidence: 0.999
  max_rotation_deg: 0.25
  max_translation_ratio: 0.002
  blend: 0.50
  point_refine_iterations: 3

motion_groups:
  enabled: true
  min_track_frames: 8
  search_radius_ratio: 0.10
  motion_residual_ratio: 0.005
  min_overlap_frames: 5
  max_neighbors: 16
  min_group_size: 4
  rigid_fit_min_points: 4
  max_rigid_residual_ratio: 0.005
  rigid_blend: 0.15

export:
  npz: true
  ply: true
  overlays: true
