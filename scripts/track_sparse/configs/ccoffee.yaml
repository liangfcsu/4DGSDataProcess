# ccoffee: 17 cameras, 2704x2028, 30 FPS, 300 frames per camera.
#
# 唯一启动命令：
# /opt/4dgs-player/env/bin/python3.11 scripts/track_sparse/start.py \
#   scripts/track_sparse/configs/ccoffee.yaml

# 路径、帧范围、GPU 和断点模式都在这里设置。
run:
  python: /opt/4dgs-player/env/bin/python3.11
  input: data/pubulicdata/ccoffee
  input_type: videos
  output: outputs/ccoffee_tracks

  start_frame: 1
  end_frame: 300
  max_frames: 300
  cameras: null                 # null 表示使用自动发现的全部 17 台相机

  gpu: 0
  undistort_workers: 16
  stages: all
  debug_frames: [1, 50, 100, 150, 200, 250, 300]

  resume: true
  overwrite: false
  preprocess_only: false
  dry_run: false
  log_level: INFO

schema_version: "2.0.0"

data:
  image_size_tolerance_px: 1
  allow_missing_frames: true

# 相机编号不连续（没有 03/13/15/17），自动相机图按真实标定重叠选邻居。
camera_graph:
  top_k: 6
  min_overlap: 0.10
  max_view_angle_deg: 100.0
  min_baseline_ratio: 0.01
  overlap_sample_points: 20000

features:
  extractor: superpoint
  max_keypoints: 4096
  keypoint_threshold: 0.005
  nms_radius: 4
  resize_max: 1600
  half_precision_cache: true

matching:
  matcher: superglue
  weights: outdoor
  sinkhorn_iterations: 50
  min_score: 0.20

spatial:
  epipolar_threshold_px: 1.5

# 每 10 帧补充一次新轨迹种子，出生要求至少三个相机一致。
spawn:
  interval: 10
  min_seed_views: 3
  duplicate_radius_px: 3.0
  min_duplicate_views: 2

temporal:
  tracker: superglue
  offsets: [1, 2]
  min_score: 0.20
  min_camera_votes: 2

association:
  offset_penalty: 0.10
  reject_cycle_inconsistent: true
  cycle_inconsistent_weight: 0.25
  cycle_consistent_bonus: 1.05
  allow_single_camera_bridge: false

triangulation:
  min_views: 2
  min_angle_deg: 1.0
  max_reprojection_error_px: 3.0
  robust_loss: huber
  max_refinement_iterations: 10

# 使用 GPU 批量三角化；24 线程 CPU 中保留 4 线程给系统和 CUDA。
performance:
  triangulation_backend: cuda
  cpu_workers: 20
  gpu_hypothesis_batch_size: 65536
  feature_cache_images: 96
  checkpoint_interval_frames: 10
  cache_spatial_groups: true

# 原始视频预处理只有固定参考 sparse，没有独立逐帧 sparse 可用于二次验证。
sparse_verify:
  enabled: false
  nn_scale: 3.0
  confidence_weight: 0.15

track:
  tentative_frames: 3
  max_occlusion_gap: 5
  max_lost_gap: 15
  log_interval: 10

uncertainty:
  min_pixel_sigma: 0.5
  damping: 1.0e-9
  max_condition_number: 1.0e12

identity_validation:
  enabled: true
  min_track_frames: 5
  max_checked_gap: 2
  max_step_ratio: 0.03
  max_acceleration_ratio: 0.02
  mad_multiplier: 8.0
  min_jump_sigma: 6.0
  cycle_bad_fraction: 0.50
  min_association_score: 0.25
  cycle_evidence_weight: 1.0
  weak_association_weight: 0.5
  split_score: 2.0
  min_segment_frames: 3

motion_models:
  min_valid_frames: 5
  max_static_observations: 512
  static_huber_px: 2.0
  static_refine_iterations: 6
  score_epsilon: 1.0e-6
  dynamic_dof_per_frame: 0.50
  selection_margin: 5.0
  static_max_reprojection_px: 2.5
  static_max_motion_sigma: 8.0
  dynamic_min_motion_sigma: 4.0

dynamic_optimization:
  min_position_std_ratio: 1.0e-5
  temporal_sigma_ratio: 0.005
  velocity_weight: 0.0
  acceleration_weight: 0.20
  max_smooth_gap: 2
  max_correction_sigma: 2.5

pose_refinement:
  enabled: true
  min_static_confidence: 0.70
  min_track_frames: 10
  min_points: 20
  ransac_iterations: 100
  max_reprojection_error_px: 2.5
  ransac_confidence: 0.999
  max_rotation_deg: 0.25
  max_translation_ratio: 0.002
  blend: 0.50
  point_refine_iterations: 3

motion_groups:
  enabled: true
  min_track_frames: 8
  search_radius_ratio: 0.10
  motion_residual_ratio: 0.005
  min_overlap_frames: 5
  max_neighbors: 16
  min_group_size: 4
  rigid_fit_min_points: 4
  max_rigid_residual_ratio: 0.005
  rigid_blend: 0.15

export:
  npz: true
  ply: true
  overlays: true
